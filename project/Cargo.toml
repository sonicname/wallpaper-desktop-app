[workspace]
resolver = "3"
members = ["apps/*", "packages/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
wallpaper-core = { path = "packages/core" }
wallpaper-favorites = { path = "packages/favorites" }
wallpaper-provider-folder = { path = "packages/provider-folder" }
wallpaper-daily = { path = "packages/daily" }
wallpaper-host = { path = "packages/host" }
wallpaper-platform-windows = { path = "packages/platform-windows" }
wallpaper-provider-wallhaven = { path = "packages/provider-wallhaven" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Image decoding and resizing are unusable without optimization.
[profile.dev.package."*"]
opt-level = 2
