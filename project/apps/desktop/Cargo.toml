[package]
name = "wallpaper-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
wallpaper-core.workspace = true
wallpaper-daily.workspace = true
wallpaper-favorites.workspace = true
wallpaper-host.workspace = true
wallpaper-platform-windows.workspace = true
wallpaper-provider-folder.workspace = true
wallpaper-provider-wallhaven.workspace = true
fastrand = "2"
raw-window-handle = "0.6"
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "system-tray", "raw-window-handle-06"] }

[build-dependencies]
slint-build = "1.19"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
