[package]
name = "wallpaper-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
wallpaper-core.workspace = true
wallpaper-host.workspace = true
wallpaper-platform-windows.workspace = true
wallpaper-provider-wallhaven.workspace = true
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software"] }

[build-dependencies]
slint-build = "1.19"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
