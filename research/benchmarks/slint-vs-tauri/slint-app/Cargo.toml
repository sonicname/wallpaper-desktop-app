[package]
name = "slint-app"
version = "0.0.0"
edition = "2021"
[features]
software = ["slint/renderer-software"]
femtovg = ["slint/renderer-femtovg"]
skia = ["slint/renderer-skia"]
[dependencies]
slint = { version = "=1.19.1", default-features = false, features = ["std","compat-1-2","backend-winit"] }
image = { version = "0.25", default-features = false, features = ["jpeg","png"] }
[build-dependencies]
slint-build = "=1.19.1"
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
