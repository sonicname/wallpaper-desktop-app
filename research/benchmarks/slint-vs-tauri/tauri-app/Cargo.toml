[package]
name = "tauri-app"
version = "0.0.0"
edition = "2021"
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
[dependencies]
tauri = { version = "~2.12", default-features = false, features = ["wry"] }
[build-dependencies]
tauri-build = { version = "2", features = [] }
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
